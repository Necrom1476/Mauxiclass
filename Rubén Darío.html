<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Juego de Preguntas y Enemigos</title>
  <style>
    canvas {
      display: block;
      margin: 0 auto;
      border: 2px solid black;
      background-color: #000;
    }

    #questionBox {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background-color: rgba(255, 255, 255, 0.95);
      padding: 20px 30px;
      border: 2px solid #333;
      border-radius: 12px;
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
      font-family: "Georgia", serif;
      z-index: 10;
      display: none;
      max-width: 400px;
      text-align: center;
    }

    #questionText {
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 20px;
    }

    #optionsContainer {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    #optionsContainer button {
      padding: 10px 20px;
      font-size: 16px;
      background-color: #f3f3f3;
      border: 1px solid #888;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    #optionsContainer button:hover {
      background-color: #ddd;
      transform: scale(1.05);
    }

    #optionsContainer button:active {
      background-color: #ccc;
      transform: scale(0.98);
    }
  </style>
</head>
<body>
  <div id="startScreen" style="
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 100%;
  background-color: #f0f0f0;
  z-index: 100;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  font-family: 'Georgia', serif;
">
  <h1 style="font-size: 36px; margin-bottom: 20px;">Las aventuras de Rubén Darío</h1>
  <label for="playerName" style="font-size: 20px; margin-bottom: 10px;">Ingresa tu nombre:</label>
  <input id="playerName" type="text" style="padding: 10px; font-size: 18px; margin-bottom: 20px;" />
  <button onclick="startGame()" style="
    padding: 12px 24px;
    font-size: 18px;
    background-color: #333;
    color: white;
    border: none;
    border-radius: 8px;
    cursor: pointer;
  ">Comenzar</button>
<div id="gameOverScreen" style="
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 100%;
  background-color: rgba(0, 0, 0, 0.8);
  color: white;
  display: none;
  justify-content: center;
  align-items: center;
  flex-direction: column;
  z-index: 200;
  font-family: 'Georgia', serif;
">
  <h2 style="font-size: 32px; margin-bottom: 20px;">¡Juego terminado!</h2>
  <button onclick="reiniciarJuego()" style="
    padding: 12px 24px;
    font-size: 18px;
    background-color: #fff;
    color: black;
    border: none;
    border-radius: 8px;
    cursor: pointer;
  ">Reiniciar</button>
</div>
</div>
<canvas id="gameCanvas" width="800" height="600"></canvas>

<div id="questionBox">
  <div id="questionText"></div>
  <div id="optionsContainer"></div>
  <div id="pantallaFinal" style="display: none;">
  <h1>¡Felicidades!</h1>
  <p>Has completado todos los niveles.</p>
  <button onclick="reiniciarJuego()">Reiniciar</button>
</div>
</div>

<script>
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

const gravity = 0.6;
const friction = 0.8;
let paused = false;

const player = {
  x: 50,
  y: 500,
  width: 40,
  height: 40,
  dx: 0,
  dy: 0,
  speed: 4,
  jumpStrength: -12,
  grounded: false,
  lives: 5,
  image: new Image(),
  facing: "right"
};

player.image.src = "https://i.imgur.com/gx2ieJ1.png";

const backgroundImage = new Image();
backgroundImage.src = "https://i.imgur.com/dUMVAfw.png";

const platforms = [
  { x: 0, y: 580, width: 800, height: 20 },
  { x: 100, y: 480, width: 200, height: 10 },
  { x: 250, y: 400, width: 200, height: 10 },
  { x: 550, y: 320, width: 200, height: 10 },
  { x: 350, y: 240, width: 200, height: 10 },
  { x: 50, y: 140, width: 200, height: 10 },
  { x: 380, y: 100, width: 200, height: 10 },
  { x: 600, y: 50, width: 200, height: 10}
];

const harmfulImages = [
  "https://i.imgur.com/AYpgVWH.png",
  "https://i.imgur.com/e036J3o.png",
  "https://i.imgur.com/MEybZqj.png",
  "https://i.imgur.com/r8QfGxx.png"
  ];

const questionImages = [
  "https://i.imgur.com/jdJrgIP.png",
  "https://i.imgur.com/Cq80lTo.png",
  "https://i.imgur.com/h6eYFGD.png",
  "https://i.imgur.com/iKxjrEJ.png",

];

const preguntasOriginales = [
  {
    texto: "¿Qué caracteriza al movimiento literario del modernismo?",
    opciones: ["La búsqueda de realismo y denuncia social", "El uso de un lenguaje refinado y simbólico", "La narrativa histórica y costumbrista"],
    respuesta: "El uso de un lenguaje refinado y simbólico"
  },
  {
    texto: "¿Cuál de los siguientes autores es considerado un representante central del modernismo?",
    opciones: ["Rubén Darío", "Gabriel García Márquez", "Jorge Luis Borges"],
    respuesta: "Rubén Darío"
  },
     {
    texto: "¿Qué importa más en el modernismo?",
    opciones: ["La belleza", "La filosofía", "La denuncia"],
    respuesta: "La belleza"
  }
];

let preguntasDisponibles = [...preguntasOriginales];

let nivelActual = 1;
const maxNiveles = 3;

// Nuevas preguntas por nivel
const preguntasNivel2 = [
  {
    texto: "¿Qué temas predominan en la literatura modernista?",
    opciones: ["El amor, la belleza, el exotismo y la evasión", "La guerra, la política y la religión", "El amor, la belleza, el exotismo y la evasión"],
    respuesta: "El amor, la belleza, el exotismo y la evasión"
  },
  {
    texto: "¿Qué ritmo y forma poética preferían muchos modernistas?",
    opciones: [" Verso libre y lenguaje coloquial", "Métrica clásica y musicalidad elaborada", "Estructura dramática en prosa"],
    respuesta: "Métrica clásica y musicalidad elaborada"
  },
  {
    texto: "¿Qué tiene de especial el modernismo?",
    opciones: ["Porque es muy bonito.", "Porque es el primer movimiento originario de Latinoamérica.", "Porque habla de hadas."],
    respuesta: "Porque es el primer movimiento originario de Latinoamérica."
  }

  
];

const preguntasNivel3 = [
  {
    texto: "¿Qué país fue el principal impulsor del modernismo en Hispanoamérica?",
    opciones: ["Argentina", "México", "Nicaragua"],
    respuesta: "Nicaragua"
  },
  {
    texto: "¿Qué influencia extranjera marcó fuertemente al modernismo hispanoamericano?",
    opciones: ["El romanticismo ruso", "El simbolismo y el parnasianismo franceses", "La novela realista inglesa"],
    respuesta: "El simbolismo y el parnasianismo franceses"
  },
  { texto: "¿Qué representaba el cisne para los modernistas?",
    opciones: ["Belleza y ternura.", "Belleza y poder.", "Belleza y solemnidad."],
    respuesta: "Belleza y solemnidad."
  },
  
];

// Nuevas plataformas por nivel
const nivelesPlataformas = {
  2: [
    { x: 350, y: 240, width: 200, height: 10 },
    { x: 100, y: 480, width: 200, height: 10 },
    { x: 600, y:  50, width: 200, height: 10 },
    { x: 250, y: 400, width: 200, height: 10 },
    { x: 550, y: 320, width: 200, height: 10 },
    { x: 50,  y: 140, width: 200, height: 10 },
    { x: 380, y: 100, width: 200, height: 10 }
  
],

  3: [
    { x: 200, y: 500, width: 200, height: 10 },
    { x: 400, y: 420, width: 200, height: 10 },
    { x: 100, y: 340, width: 200, height: 10 },
    { x: 300, y: 260, width: 200, height: 10 },
    { x: 500, y: 180, width: 200, height: 10 },
    { x: 250, y: 100, width: 200, height: 10 },
    { x: 600, y: 60, width: 200, height: 10 }
  ]
};

function obtenerPreguntaAleatoria() {
  if (preguntasDisponibles.length === 0) return null;
  const idx = Math.floor(Math.random() * preguntasDisponibles.length);
  return preguntasDisponibles.splice(idx, 1)[0];
}

function imagenAleatoria(tipo) {
  const img = new Image();
  const url = tipo === "harmful"
    ? harmfulImages[Math.floor(Math.random() * harmfulImages.length)]
    : questionImages[Math.floor(Math.random() * questionImages.length)];
  img.src = url;
  return img;
}

const tiposControlados = ["harmful", "harmful", "harmful", "question", "question", "question"];

// Mezclar aleatoriamente los tipos
for (let i = tiposControlados.length - 1; i > 0; i--) {
  const j = Math.floor(Math.random() * (i + 1));
  [tiposControlados[i], tiposControlados[j]] = [tiposControlados[j], tiposControlados[i]];
}

const elements = platforms.map((plat, i) => {
  if (i === 0 || i === platforms.length - 1) {
    // Plataforma base y última (nexo) sin elemento
    return {
      x: 0,
      y: 0,
      width: 0,
      height: 0,
      active: false,
      triggered: true,
      type: null,
      platformIndex: i,
      question: null,
      dx: 0,
      dy: 0,
      tracking: false,
      image: null,
      angle: null
    };
  }

  const type = tiposControlados[i - 1]; // Ajuste por base
  return {
    x: plat.x + plat.width / 2 - 20,
    y: plat.y - 40,
    width: 40,
    height: 40,
    active: false,
    triggered: false,
    type: type,
    platformIndex: i,
    question: type === "question" ? obtenerPreguntaAleatoria() : null,
    respondida: type === "question" ? false : null,
    dx: 0,
    dy: 0,
    tracking: true,
    image: imagenAleatoria(type),
    angle: type === "harmful" ? 0 : null
  };
});

const keys = { right: false, left: false };

document.addEventListener("keydown", (e) => {
  if (paused) return;
  if (e.code === "ArrowRight") {
    keys.right = true;
    player.facing = "right";
  }
  if (e.code === "ArrowLeft") {
    keys.left = true;
    player.facing = "left";
  }
  if ((e.code === "ArrowUp" || e.code === "Space") && player.grounded) {
    player.dy = player.jumpStrength;
    player.grounded = false;
  }
});

document.addEventListener("keyup", (e) => {
  if (e.code === "ArrowRight") keys.right = false;
  if (e.code === "ArrowLeft") keys.left = false;
});

function checkCollision(a, b) {
  return (
    a.x < b.x + b.width &&
    a.x + a.width > b.x &&
    a.y < b.y + b.height &&
    a.y + a.height > b.y
  );
}

function checkPlatformCollision(p, plat) {
  return (
    p.x < plat.x + plat.width &&
    p.x + p.width > plat.x &&
    p.y + p.height < plat.y + plat.height &&
    p.y + p.height + p.dy >= plat.y
  );
}

function mostrarPregunta(q, callback) {
  if (!q) {
    callback(false);
    return;
  }

  paused = true;
  keys.left = false;
  keys.right = false;

  const box = document.getElementById("questionBox");
  const text = document.getElementById("questionText");
  const options = document.getElementById("optionsContainer");

  text.textContent = q.texto;
  options.innerHTML = "";

  // Validar si hay opciones disponibles
  if (!q.opciones || !Array.isArray(q.opciones)) {
    console.error("La pregunta no tiene opciones válidas:", q);
    text.textContent = "Error: esta pregunta no tiene opciones disponibles.";
    return;
  }

  q.opciones.forEach(op => {
    const btn = document.createElement("button");
    btn.textContent = op;
    btn.onclick = () => {
  box.style.display = "none";
  const esCorrecto = (op === q.respuesta);
  
  // Aquí: marcar la pregunta como respondida
  const indexElemento = elements.findIndex(e => e.question === q);
  if (indexElemento !== -1) {
    elements[indexElemento].respondida = true;
  }

  callback(esCorrecto);
  paused = false;
};
    options.appendChild(btn);
  });

  box.style.display = "block";
}

function update() {
  if (paused || player.lives <= 0) return;

  if (keys.right) player.dx = player.speed;
  else if (keys.left) player.dx = -player.speed;
  else player.dx *= friction;

  player.dy += gravity;
  player.grounded = false;

  platforms.forEach((plat, i) => {
    if (checkPlatformCollision(player, plat)) {
  // Plataforma especial: última
  {
  player.dy = 0;
  player.grounded = true;
  player.y = plat.y - player.height;

  if (i > 0 && i < platforms.length - 1 && !elements[i].triggered) {
    elements[i].triggered = true;
    setTimeout(() => {
      elements[i].active = true;
    }, 100);
  }
 
if (i === platforms.length - 1) {
  if (todasLasPreguntasRespondidas()) {
    if (nivelActual < maxNiveles) {
      avanzarNivel();
      return;
    } else {
      mostrarMensajeFinalConImagen();
    }
  } else {
    // Bloquear avance si no ha respondido todas
    player.dx = 0;
  }
}
}

  player.dy = 0;
  player.grounded = true;
  player.y = plat.y - player.height;

  if (i > 0 && i < platforms.length - 1 && !elements[i].triggered) {
    elements[i].triggered = true;
    setTimeout(() => {
      elements[i].active = true;
    }, 100);
  }
}
  });

  player.x += player.dx;
  player.y += player.dy;

  if (player.x < 0) player.x = 0;
  if (player.x + player.width > canvas.width) player.x = canvas.width - player.width;
  if (player.y > canvas.height) {
    player.x = 50;
    player.y = 500;
    player.dy = 0;
    player.dx = 0;
  }

  elements.forEach(el => {
    if (!el.active) return;

    const plat = platforms[el.platformIndex];

    if (el.type === "harmful") {
      el.angle += 0.05;
      if (el.tracking) {
        if (Math.abs((plat.y - el.height) - el.y) < 5 &&
            Math.abs((plat.y - player.height) - player.y) < 5) {
          el.dx = player.x < el.x ? -2 : 2;
        } else {
          el.tracking = false;
          if (el.dx === 0) el.dx = Math.random() < 0.5 ? -2 : 2;
        }
      }

      el.x += el.dx;

      if (el.x <= plat.x || el.x + el.width >= plat.x + plat.width) {
        el.dx *= -1;
      }

      if (el.y > plat.y + 10) {
        el.active = false;
      }
    }

    if (checkCollision(player, el)) {
      if (el.type === "harmful") {
        player.lives -= 1;
        el.active = false;
        keys.left = false;
        keys.right = false;
      } else if (el.type === "question") {
        mostrarPregunta(el.question, (correcto) => {
          if (!correcto) {
            player.lives -= 1;
          }
          el.active = false;
       
        });
      }
    }
  });
}

function draw() {
  if (backgroundImage.complete) {
    ctx.drawImage(backgroundImage, 0, 0, canvas.width, canvas.height);
  } else {
    ctx.fillStyle = "#000";
    ctx.fillRect(0, 0, canvas.width, canvas.height);
  }

  if (player.image.complete) {
    ctx.save();
    if (player.facing === "left") {
      ctx.scale(-1, 1);
      ctx.drawImage(player.image, -player.x - player.width, player.y, player.width, player.height);
    } else {
      ctx.drawImage(player.image, player.x, player.y, player.width, player.height);
    }
    ctx.restore();
  } else {
    ctx.fillStyle = "blue";
    ctx.fillRect(player.x, player.y, player.width, player.height);
  }

  ctx.fillStyle = "red";
  platforms.forEach(p => {
    ctx.fillRect(p.x, p.y, p.width, p.height);
  });

  elements.forEach(el => {
    if (el.active) {
      if (el.image && el.image.complete) {
        if (el.type === "harmful") {
          ctx.save();
          ctx.translate(el.x + el.width / 2, el.y + el.height / 2);
          ctx.rotate(el.angle);
          ctx.drawImage(el.image, -el.width / 2, -el.height / 2, el.width, el.height);
          ctx.restore();
        } else {
          ctx.drawImage(el.image, el.x, el.y, el.width, el.height);
        }
      } else {
        ctx.fillStyle = el.type === "harmful" ? "red" : "yellow";
        ctx.fillRect(el.x, el.y, el.width, el.height);
      }
    }
  });

  ctx.fillStyle = "white";
  ctx.font = "20px Arial";
  ctx.fillText("Vidas: " + player.lives, 10, 30);

  if (player.lives <= 0) {
    ctx.fillStyle = "yellow";
    ctx.font = "40px Arial";
    ctx.fillText("¡Juego Terminado!", canvas.width / 2 - 150, canvas.height / 2);
    document.getElementById("gameOverScreen").style.display = "block";
  }
}
function todasLasPreguntasRespondidas() {
  return elements
    .filter(e => e.type === "question")
    .every(e => e.respondida === true);
}
function todasLasPreguntasRespondidas() {
  return elements.every(el => {
    if (el.type === "question") {
      return el.respondida === true;
    }
    return true; // Los elementos no pregunta se consideran "respondidos"
  });
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}



function avanzarNivel() {
  nivelActual++;
  preguntasDisponibles = nivelActual === 2 ? [...preguntasNivel2]
                      : nivelActual === 3 ? [...preguntasNivel3]
                      : [];

   cambiarPlataformasPorNivel(nivelActual);                   
  // Reset del jugador
  player.x = 50;
  player.y = 500;
  player.dx = 0;
  player.dy = 0;

  // Actualizar plataformas según nivel
  if (nivelesPlataformas[nivelActual]) {
    for (let i = 1; i < platforms.length - 1; i++) {
      platforms[i] = nivelesPlataformas[nivelActual][i - 1];
    }
  }

  // Regenerar elementos
  for (let i = 1; i < platforms.length - 1; i++) {
    const type = tiposControlados[i - 1] || "harmful";
    elements[i] = {
      x: platforms[i].x + platforms[i].width / 2 - 20,
      y: platforms[i].y - 40,
      width: 40,
      height: 40,
      active: false,
      triggered: false,
      type: type,
      platformIndex: i,
      question: type === "question" ? obtenerPreguntaAleatoria() : null,
      dx: 0,
      dy: 0,
      tracking: true,
      image: imagenAleatoria(type),
      angle: type === "harmful" ? 0 : null
    };
  }
}

function avanzarNivel() {
  nivelActual++;
  if (nivelActual > maxNiveles) return;

  // Cargar nuevas preguntas
  if (nivelActual === 2) preguntasDisponibles = [...preguntasNivel2];
  else if (nivelActual === 3) preguntasDisponibles = [...preguntasNivel3];

  // Actualizar plataformas
  platforms.splice(1, platforms.length - 2, ...nivelesPlataformas[nivelActual]);

  // Crear nuevos elementos
  const nuevosTipos = ["harmful", "harmful", "harmful", "question", "question", "question"];
  for (let i = nuevosTipos.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [nuevosTipos[i], nuevosTipos[j]] = [nuevosTipos[j], nuevosTipos[i]];
  }

  for (let i = 1; i < platforms.length - 1; i++) {
    const tipo = nuevosTipos[i - 1];
    elements[i] = {
      x: platforms[i].x + platforms[i].width / 2 - 20,
      y: platforms[i].y - 40,
      width: 40,
      height: 40,
      active: false,
      triggered: false,
      type: tipo,
      platformIndex: i,
      question: tipo === "question" ? obtenerPreguntaAleatoria() : null,
      dx: 0,
      dy: 0,
      tracking: true,
      image: imagenAleatoria(tipo),
      angle: tipo === "harmful" ? 0 : null
    };
  }

  // Reiniciar jugador
  player.x = 50;
  player.y = 500;
  player.dx = 0;
  player.dy = 0;
}
function plataformasDeNivel(nivel, nuevasPreguntas) {
  preguntasDisponibles = [...nuevasPreguntas];
  const nuevas = nivelesPlataformas[nivel];

  plataformas.length = 1; // Conserva solo la base
  nuevas.forEach(p => plataformas.push(p));
  plataformas.push({ x: 600, y: 20, width: 200, height: 10 }); // última

  // Elementos
  const tipos = ["harmful", "harmful", "question", "question", "harmful", "question", "question"];
  for (let i = tipos.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [tipos[i], tipos[j]] = [tipos[j], tipos[i]];
  }

  elements.length = plataformas.length;
  for (let i = 0; i < plataformas.length; i++) {
    if (i === 0 || i === plataformas.length - 1) {
      elements[i] = {
        x: 0,
        y: 0,
        width: 0,
        height: 0,
        active: false,
        triggered: true,
        type: null,
        platformIndex: i,
        question: null,
        dx: 0,
        dy: 0,
        tracking: false,
        image: null,
        angle: null
      };
    } else {
      const tipo = tipos[i - 1];
      elements[i] = {
        x: plataformas[i].x + plataformas[i].width / 2 - 20,
        y: plataformas[i].y - 40,
        width: 40,
        height: 40,
        active: false,
        triggered: false,
        type: tipo,
        platformIndex: i,
        question: tipo === "question" ? obtenerPreguntaAleatoria() : null,
        dx: 0,
        dy: 0,
        tracking: true,
        image: imagenAleatoria(tipo),
        angle: tipo === "harmful" ? 0 : null
      };
    }
  }
}

function mostrarMensajeFinalConImagen() {
  paused = true;
  document.getElementById("questionBox").style.display = "block";
  document.getElementById("questionText").style.display = "none";
  document.getElementById("optionsContainer").style.display = "none";
  document.getElementById("pantallaFinal").style.display = "block";
}

function reiniciarJuego() {
  nivelActual = 1;
  preguntasDisponibles = [...preguntasOriginales];
  platforms.splice(1);
  platforms.push(...nivelesPlataformas[1] || []);
  player.x = 50;
  player.y = 500;
  player.lives = 5;
  document.getElementById("questionText").style.display = "block";
  document.getElementById("optionsContainer").style.display = "flex";
  document.getElementById("pantallaFinal").style.display = "none";
  document.getElementById("questionBox").style.display = "none";
  paused = false;
  // Puedes volver a inicializar elementos si deseas
  location.reload(); // También puedes recargar la página si lo prefieres
}
